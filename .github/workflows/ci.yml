name: CI

# Lint, test, and build-check the app (Week4/web), and gate-check the Week 1
# Claude Skills in .claude/skills/. Runs on EVERY push (any branch) and on every
# pull request; a failing check does not pass.
on: [push, pull_request]

jobs:
  web:
    name: Web — lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Week4/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Week4/web/package-lock.json
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test (unit tests from MVP requirements — anonymity, funding, the gap)
        run: npm test
      - name: Build
        run: npm run build

  skills:
    name: Claude Skills gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Gate-check Week 1 Claude Skills
        run: node scripts/check-skills.mjs
